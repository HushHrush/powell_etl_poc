version: 2

models:
  # Staging Models
  - name: stg_oracle_fnd_user
    description: "Staging model for Oracle FND_USER table"
    columns:
      - name: user_id
        description: "Unique user identifier"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "User login name"
        tests:
          - not_null

  - name: stg_oracle_per_all_people_f
    description: "Staging model for Oracle PER_ALL_PEOPLE_F table"
    columns:
      - name: person_id
        description: "Unique person identifier"
        tests:
          - not_null
      - name: effective_start_date
        description: "Record effective start date"
      - name: effective_end_date
        description: "Record effective end date"
      - name: first_name
        description: "First name"
      - name: last_name
        description: "Last name"
      - name: full_name
        description: "Full name"
      - name: sex
        description: "Gender code"
      - name: date_of_birth
        description: "Date of birth"
      - name: marital_status
        description: "Marital status code"
      - name: address_line1
        description: "Address line 1"
      - name: town_or_city
        description: "City"
      - name: state_province
        description: "State/Province"
      - name: country
        description: "Country code"
      - name: postal_code
        description: "Postal/ZIP code"
      - name: work_telephone
        description: "Work telephone number"

  - name: stg_oracle_org_definitions
    description: "Staging model for organization definitions"
    
  # Intermediate Models
  - name: int_user_extract
    description: "Intermediate model joining FND_USER with PER_ALL_PEOPLE_F - equivalent to Informatica SDE_ORA_UserDimension"
    columns:
      - name: integration_id
        description: "Natural key derived from USER_ID"
        tests:
          - not_null

  - name: int_user_staging
    description: "Intermediate staging layer preparing data for dimension load"

  - name: int_user_with_lookups
    description: "Intermediate model with code lookups applied (Gender, State, Country)"
    
  # Mart Models
  - name: dim_user
    description: >
      User Dimension table (W_USER_D) - contains information about users who created 
      or modified records in the source system. Supports SCD Type 2 for tracking 
      historical changes. Converted from Informatica SIL_UserDimension mapping.
    columns:
      - name: row_wid
        description: "Surrogate key to uniquely identify a record"
        tests:
          - not_null
      - name: first_name
        description: "First name of the user"
      - name: mid_name
        description: "Middle name of the user"
      - name: last_name
        description: "Last name of the user"
      - name: full_name
        description: "Full name of the user"
      - name: name_prefix
        description: "Name prefix (e.g., Mr., Mrs., Dr.)"
      - name: name_suffix
        description: "Name suffix (e.g., Jr., Sr., III)"
      - name: sex_mf_code
        description: "Gender code (M/F)"
      - name: sex_mf_name
        description: "Gender description"
      - name: marital_status_code
        description: "Marital status code (S/M/D/W)"
      - name: marital_status_name
        description: "Marital status description"
      - name: birth_dt
        description: "Date of birth"
      - name: address1
        description: "Primary address line 1"
      - name: address2
        description: "Primary address line 2"
      - name: city
        description: "City"
      - name: state_code
        description: "State/Province code"
      - name: state_name
        description: "State/Province name"
      - name: country_code
        description: "Country code"
      - name: country_name
        description: "Country name"
      - name: zipcode
        description: "Postal/ZIP code"
      - name: work_phone
        description: "Work telephone number"
      - name: hire_dt
        description: "User account start date"
      - name: term_dt
        description: "User account end date (termination)"
      - name: primary_email_addr
        description: "Primary email address"
      - name: login
        description: "User login ID"
      - name: emp_flg
        description: "Employee flag (Y/N)"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: active_flg
        description: "Active flag (Y/N)"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: bus_grp_name
        description: "Business group name"
      - name: ledger_name
        description: "General ledger name"
      - name: currency_code
        description: "Base currency code"
      - name: effective_from_dt
        description: "SCD Type 2 effective start date"
        tests:
          - not_null
      - name: effective_to_dt
        description: "SCD Type 2 effective end date"
      - name: current_flg
        description: "Current record indicator (Y/N)"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: delete_flg
        description: "Soft delete indicator (Y/N)"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: integration_id
        description: "Natural key from source system"
        tests:
          - not_null
      - name: datasource_num_id
        description: "Source system identifier"
        tests:
          - not_null

  - name: dim_user_scd_update
    description: >
      SCD Type 2 update model - handles updating historical records when new 
      records are inserted. Sets EFFECTIVE_TO_DT and CURRENT_FLG for old records.
      Converted from Informatica SIL_UserDimension_SCDUpdate mapping.
